# Isolated SpringBootTest profile — in-memory H2, no production MySQL / Flyway.
spring.datasource.url=jdbc:h2:mem:booknplay;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

jwt.secret=test-secret-key-that-is-long-enough-for-hs256-algorithms!!
booknplay.admin.email=
booknplay.admin.password=
