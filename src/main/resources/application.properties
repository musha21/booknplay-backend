spring.application.name=booknplay

# Shared defaults for all profiles. Activate local or prod with SPRING_PROFILES_ACTIVE.
# Secrets belong in application-local.properties (gitignored) or environment variables — never commit them.
# When no profile is set (local IDE / Maven), use local. VPS overrides with SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=local


# =============================================================================
# DATABASE
# =============================================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/booknplay?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =============================================================================
# JPA / HIBERNATE
# =============================================================================

# Profile-specific: local uses update; prod uses validate.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Quiet by default; enable DEBUG/TRACE only under the local profile.
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN


# =============================================================================
# SERVER
# =============================================================================

server.port=8080


# =============================================================================
# JWT
# =============================================================================

# Set JWT_SECRET (prod) or jwt.secret in application-local.properties (local).
jwt.secret=${JWT_SECRET:}
jwt.access-token-expiry-ms=900000
jwt.refresh-token-expiry-ms=604800000


# =============================================================================
# MAIL - GMAIL SMTP
# =============================================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# =============================================================================
# API DOCUMENTATION - SWAGGER / OPENAPI
# =============================================================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method


# =============================================================================
# APPLICATION
# =============================================================================

app.name=BooknPlay.lk
app.base-url=${BOOKNPLAY_BASE_URL:http://localhost:8080}
app.frontend-url=${BOOKNPLAY_FRONTEND_URL:http://localhost:5173}
app.upload-dir=uploads
booknplay.calendar.slot-duration-minutes=60
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=32MB
server.tomcat.max-http-form-post-size=32MB
server.tomcat.max-swallow-size=32MB

booknplay.admin.email=${BOOKNPLAY_ADMIN_EMAIL:admin@booknplay.lk}
booknplay.admin.password=${BOOKNPLAY_ADMIN_PASSWORD:}

booknplay.payments.mode=${BOOKNPLAY_PAYMENTS_MODE:PAYHERE}
booknplay.booking.hold-ttl-minutes=${BOOKNPLAY_BOOKING_HOLD_TTL_MINUTES:10}
booknplay.booking.hold-expiry-interval-ms=${BOOKNPLAY_BOOKING_HOLD_EXPIRY_INTERVAL_MS:60000}

# PayHere — sandbox URL defaults; override secrets and live URLs via env / profile.
payhere.merchant-id=${PAYHERE_MERCHANT_ID:}
payhere.merchant-secret=${PAYHERE_MERCHANT_SECRET:}
payhere.checkout-url=${PAYHERE_CHECKOUT_URL:https://sandbox.payhere.lk/pay/checkout}
payhere.return-url=${PAYHERE_RETURN_URL:http://localhost:8080/api/v1/public/payhere/return}
payhere.cancel-url=${PAYHERE_CANCEL_URL:http://localhost:8080/api/v1/public/payhere/cancel}
payhere.notify-url=${PAYHERE_NOTIFY_URL:http://localhost:8080/api/v1/webhook/payhere/notify}
booknplay.subscriptions.return-url=${BOOKNPLAY_SUBSCRIPTION_RETURN_URL:http://localhost:5173/owner/billing/return}
booknplay.subscriptions.cancel-url=${BOOKNPLAY_SUBSCRIPTION_CANCEL_URL:http://localhost:5173/owner/billing/return}
payhere.app-id=${PAYHERE_APP_ID:}
payhere.app-secret=${PAYHERE_APP_SECRET:}
payhere.oauth-token-url=${PAYHERE_OAUTH_TOKEN_URL:https://sandbox.payhere.lk/merchant/v1/oauth/token}
payhere.refund-url=${PAYHERE_REFUND_URL:https://sandbox.payhere.lk/merchant/v1/payment/refund}

# SMSlenz — set credentials in application-local.properties or SMSLENZ_* env vars.
smslenz.base-url=https://smslenz.lk/api
smslenz.user-id=${SMSLENZ_USER_ID:}
smslenz.api-key=${SMSLENZ_API_KEY:}
smslenz.sender-id=${SMSLENZ_SENDER_ID:SMSlenzDEMO}

booknplay.otp.expiry-seconds=300
booknplay.otp.max-attempts=5
booknplay.otp.resend-cooldown-seconds=60
booknplay.otp.registration-token-expiry-ms=900000
