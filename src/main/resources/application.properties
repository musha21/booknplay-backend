spring.application.name=booknplay
spring.config.import=optional:classpath:application-local.properties


# ?????????????????????????????????????????????????????????????????????????????
# DATABASE
# ?????????????????????????????????????????????????????????????????????????????

spring.datasource.url=jdbc:mysql://localhost:3306/booknplay?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ?????????????????????????????????????????????????????????????????????????????
# JPA / HIBERNATE
# ?????????????????????????????????????????????????????????????????????????????

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Compact SQL output
spring.jpa.properties.hibernate.format_sql=false

# Hibernate SQL logging
logging.level.org.hibernate.SQL=DEBUG

# Show SQL parameter values
logging.level.org.hibernate.orm.jdbc.bind=TRACE


# ?????????????????????????????????????????????????????????????????????????????
# SERVER
# ?????????????????????????????????????????????????????????????????????????????

server.port=8080


# ?????????????????????????????????????????????????????????????????????????????
# JWT
# ?????????????????????????????????????????????????????????????????????????????

# IMPORTANT:
# Replace this with a secure 256-bit Base64 encoded secret in production
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# Access token: 15 minutes
jwt.access-token-expiry-ms=900000

# Refresh token: 7 days
jwt.refresh-token-expiry-ms=604800000


# ?????????????????????????????????????????????????????????????????????????????
# MAIL - GMAIL SMTP
# ?????????????????????????????????????????????????????????????????????????????

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=noreply@booknplay.lk
spring.mail.password=your-app-password

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# ?????????????????????????????????????????????????????????????????????????????
# API DOCUMENTATION - SWAGGER / OPENAPI
# ?????????????????????????????????????????????????????????????????????????????

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method


# ?????????????????????????????????????????????????????????????????????????????
# APPLICATION
# ?????????????????????????????????????????????????????????????????????????????

app.name=BooknPlay.lk
app.base-url=http://localhost:8080
app.frontend-url=${BOOKNPLAY_FRONTEND_URL:http://localhost:5173}
app.upload-dir=uploads
booknplay.calendar.slot-duration-minutes=60
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=32MB
server.tomcat.max-http-form-post-size=32MB
server.tomcat.max-swallow-size=32MB

# Development administrator. Environment variables override these defaults.
booknplay.admin.email=${BOOKNPLAY_ADMIN_EMAIL:admin@booknplay.lk}
booknplay.admin.password=${BOOKNPLAY_ADMIN_PASSWORD:admin123}

# Customer checkout uses PayHere sandbox only. Set PAYHERE_MERCHANT_SECRET in the environment.
booknplay.payments.mode=${BOOKNPLAY_PAYMENTS_MODE:PAYHERE}
# Soft-hold while awaiting PayHere; unpaid PENDING bookings expire after this many minutes.
booknplay.booking.hold-ttl-minutes=${BOOKNPLAY_BOOKING_HOLD_TTL_MINUTES:5}
booknplay.booking.hold-expiry-interval-ms=${BOOKNPLAY_BOOKING_HOLD_EXPIRY_INTERVAL_MS:60000}

payhere.merchant-id=${PAYHERE_MERCHANT_ID:1238375}
payhere.merchant-secret=${PAYHERE_MERCHANT_SECRET:}
payhere.checkout-url=${PAYHERE_CHECKOUT_URL:https://sandbox.payhere.lk/pay/checkout}
payhere.return-url=${PAYHERE_RETURN_URL:http://localhost:5173/payment/return}
payhere.cancel-url=${PAYHERE_CANCEL_URL:http://localhost:5173/payment/return}
payhere.notify-url=${PAYHERE_NOTIFY_URL:http://localhost:8080/api/v1/webhook/payhere/notify}
# Owner platform subscription return URLs (PayHere redirects after plan checkout).
booknplay.subscriptions.return-url=${BOOKNPLAY_SUBSCRIPTION_RETURN_URL:http://localhost:5173/owner/billing/return}
booknplay.subscriptions.cancel-url=${BOOKNPLAY_SUBSCRIPTION_CANCEL_URL:http://localhost:5173/owner/billing/return}
# Refund API (Settings → API Keys). Separate from merchant secret used for checkout.
payhere.app-id=${PAYHERE_APP_ID:}
payhere.app-secret=${PAYHERE_APP_SECRET:}
payhere.oauth-token-url=${PAYHERE_OAUTH_TOKEN_URL:https://sandbox.payhere.lk/merchant/v1/oauth/token}
payhere.refund-url=${PAYHERE_REFUND_URL:https://sandbox.payhere.lk/merchant/v1/payment/refund}

# ?????????????????????????????????????????????????????????????????????????????
# SMSLENZ SMS OTP
# ?????????????????????????????????????????????????????????????????????????????
# Prefer application-local.properties for local secrets (imported above).
# OS / IDE env vars SMSLENZ_USER_ID, SMSLENZ_API_KEY, SMSLENZ_SENDER_ID override
# both this file and application-local.properties — keep them in sync with the
# SMSlenz account that owns the sender ID (e.g. AVENQUE on user 2153).
# Never expose these via API responses.

smslenz.base-url=https://smslenz.lk/api
smslenz.user-id=${SMSLENZ_USER_ID:}
smslenz.api-key=${SMSLENZ_API_KEY:}
smslenz.sender-id=${SMSLENZ_SENDER_ID:SMSlenzDEMO}

booknplay.otp.expiry-seconds=300
booknplay.otp.max-attempts=5
booknplay.otp.resend-cooldown-seconds=60
booknplay.otp.registration-token-expiry-ms=900000