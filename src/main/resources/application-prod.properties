# Production profile (Ubuntu VPS). Activate with SPRING_PROFILES_ACTIVE=prod.
# All secrets and public URLs come from environment variables — see production.env.example.
# Does not load application-local.properties. Do not put real credentials in this file.

# -----------------------------------------------------------------------------
# DATABASE (Flyway owns DDL; Hibernate ddl-auto=validate only)
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/booknplay?useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true
spring.datasource.username=booknplay_app
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Existing prod DBs created before Flyway must be baselined (version 1) before first enable — do not re-run V1 CREATE.

# -----------------------------------------------------------------------------
# PUBLIC URLS
# -----------------------------------------------------------------------------
app.base-url=${BOOKNPLAY_BASE_URL}
app.frontend-url=${BOOKNPLAY_FRONTEND_URL}

# -----------------------------------------------------------------------------
# SECRETS
# -----------------------------------------------------------------------------
jwt.secret=${JWT_SECRET}
booknplay.admin.email=${BOOKNPLAY_ADMIN_EMAIL}
booknplay.admin.password=${BOOKNPLAY_ADMIN_PASSWORD}

spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

# -----------------------------------------------------------------------------
# PAYHERE (return / cancel / notify / subscription / refund — all configurable)
# -----------------------------------------------------------------------------
payhere.merchant-id=${PAYHERE_MERCHANT_ID}
payhere.merchant-secret=${PAYHERE_MERCHANT_SECRET}
payhere.checkout-url=${PAYHERE_CHECKOUT_URL}
payhere.return-url=${PAYHERE_RETURN_URL}
payhere.cancel-url=${PAYHERE_CANCEL_URL}
payhere.notify-url=${PAYHERE_NOTIFY_URL}
payhere.app-id=${PAYHERE_APP_ID}
payhere.app-secret=${PAYHERE_APP_SECRET}
payhere.oauth-token-url=${PAYHERE_OAUTH_TOKEN_URL}
payhere.refund-url=${PAYHERE_REFUND_URL}
booknplay.subscriptions.return-url=${BOOKNPLAY_SUBSCRIPTION_RETURN_URL}
booknplay.subscriptions.cancel-url=${BOOKNPLAY_SUBSCRIPTION_CANCEL_URL}

# -----------------------------------------------------------------------------
# SMSLENZ
# -----------------------------------------------------------------------------
smslenz.user-id=${SMSLENZ_USER_ID}
smslenz.api-key=${SMSLENZ_API_KEY}
smslenz.sender-id=${SMSLENZ_SENDER_ID}
